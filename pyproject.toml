[project]
name = "snapstream"
version = "0.1.0"
description = "A production-minded asynchronous social feed API"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "alembic>=1.13,<2",
    "asyncpg>=0.29,<1",
    "boto3>=1.35,<2",
    "fastapi[standard]>=0.115,<1",
    "pydantic-settings>=2.6,<3",
    "redis>=5.2,<6",
    "sqlalchemy[asyncio]>=2.0.36,<3",
]

[project.optional-dependencies]
test = [
    "aiosqlite>=0.20,<1",
    "httpx>=0.27,<1",
    "pytest>=8.3,<9",
    "pytest-asyncio>=1.2,<2",
]

[project.scripts]
snapstream = "snapstream:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
